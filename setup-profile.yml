# ==============================================================================
# ONE-FILE PROFILE SETUP
# ------------------------------------------------------------------------------
# What this is: a single GitHub Actions workflow that builds your entire
# profile for you. Upload just this one file to:
#
#     your-username-repo/.github/workflows/setup-profile.yml
#
# ...where "your-username-repo" is a repo named EXACTLY your GitHub username
# (create it if it doesn't exist yet — GitHub will confirm with a banner
# saying "You've discovered a secret ✨" once it's set up correctly).
#
# HOW TO RUN IT (2 one-time steps, both in the repo's Settings tab):
#   1. Settings → Actions → General → "Workflow permissions" →
#      select "Read and write permissions" → Save.
#      (Required so this workflow is allowed to commit files back to the repo.)
#   2. Go to the "Actions" tab → click "Build My Profile" on the left →
#      click "Run workflow" (green button) → wait ~60-90 seconds.
#
# After that first manual run, it also re-runs automatically on a daily
# schedule to keep the isometric contribution-city animation fresh.
#
# WHAT IT DOES AUTOMATICALLY:
#   - Detects your GitHub username from the repo itself (no typing it in).
#   - Writes a complete, premium README.md (hero, typing effect, tech stack,
#     stats, streak, activity graph, trophies, dynamic quote, contact badges).
#   - Runs the open-source "github-profile-3d-contrib" action to generate an
#     isometric contribution-city animation from your real commit history.
#   - Commits README.md + the generated animation files back to this repo.
#
# WHAT YOU MAY STILL WANT TO EDIT AFTERWARDS (optional, not required to work):
#   - Your email / LinkedIn / portfolio link (placeholders are left in place
#     and clearly labeled — the profile works fine without changing them).
#   - The 5 example project cards (currently placeholder images/links).
# ==============================================================================

name: Build My Profile

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"   # keep the contribution city fresh, once a day

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate isometric contribution city
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Write README.md
        env:
          GH_USER: ${{ github.repository_owner }}
        run: |
          cat > README.md << 'README_EOF'
